name: Lint

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  shellcheck:
    name: ShellCheck
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Run ShellCheck on monitoring/
        run: |
          find monitoring -name "*.sh" -print0 | xargs -0 shellcheck --severity=error

      - name: Run ShellCheck on renewal/
        run: |
          find renewal -name "*.sh" -print0 | xargs -0 shellcheck --severity=error

      - name: Run ShellCheck on revocation/
        run: |
          find revocation -name "*.sh" -print0 | xargs -0 shellcheck --severity=error

      - name: Run ShellCheck on examples/
        run: |
          find examples -name "*.sh" -print0 | xargs -0 shellcheck --severity=error

      - name: Run ShellCheck on scripts/
        run: |
          find scripts -name "*.sh" -print0 | xargs -0 shellcheck --severity=error

  syntax-check:
    name: Bash Syntax
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Validate Bash syntax
        run: |
          find monitoring renewal revocation examples scripts -name "*.sh" -print0 | xargs -0 -I {} bash -n {}
