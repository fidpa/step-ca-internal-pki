# Generic nginx TLS Termination Template for step-ca
#
# Replace PLACEHOLDERS:
#   SERVICE_NAME - Your service name (e.g., myservice)
#   BACKEND_HOST - Backend host (e.g., localhost, myservice)
#   BACKEND_PORT - Backend port (e.g., 8080, 3000)

events {
    worker_connections 1024;
}

http {
    upstream backend {
        server BACKEND_HOST:BACKEND_PORT;
    }

    # HTTP -> HTTPS redirect
    server {
        listen 80;
        server_name SERVICE_NAME.internal;
        return 301 https://$server_name$request_uri;
    }

    # HTTPS with step-ca certificate
    server {
        listen 443 ssl http2;
        server_name SERVICE_NAME.internal;

        # step-ca TLS certificates
        # Certificate files location: /etc/ssl/step-ca/SERVICE_NAME.*
        ssl_certificate /etc/nginx/ssl/fullchain.crt;
        ssl_certificate_key /etc/nginx/ssl/cert.key;

        # TLS configuration (Mozilla Intermediate Profile)
        ssl_protocols TLSv1.2 TLSv1.3;
        ssl_ciphers 'ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384';
        ssl_prefer_server_ciphers on;
        ssl_session_cache shared:SSL:10m;
        ssl_session_timeout 10m;

        # Security headers
        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header X-XSS-Protection "1; mode=block" always;

        # Proxy settings
        client_max_body_size 100M;

        location / {
            proxy_pass http://backend;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;

            # Timeouts
            proxy_connect_timeout 60s;
            proxy_send_timeout 60s;
            proxy_read_timeout 60s;
        }

        # WebSocket support (uncomment if needed)
        # location /ws {
        #     proxy_pass http://backend;
        #     proxy_http_version 1.1;
        #     proxy_set_header Upgrade $http_upgrade;
        #     proxy_set_header Connection "upgrade";
        #     proxy_set_header Host $host;
        # }
    }
}
