services:
  portainer:
    image: portainer/portainer-ce:latest
    container_name: portainer
    restart: unless-stopped
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - portainer_data:/data
    networks:
      - portainer-net

  nginx:
    image: nginx:alpine
    container_name: portainer-nginx
    restart: unless-stopped
    ports:
      - "443:443"
      - "80:80"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
      - /etc/ssl/step-ca/portainer.crt:/etc/nginx/ssl/cert.crt:ro
      - /etc/ssl/step-ca/portainer-fullchain.crt:/etc/nginx/ssl/fullchain.crt:ro
      - /etc/ssl/step-ca/portainer.key:/etc/nginx/ssl/cert.key:ro
    networks:
      - portainer-net
    depends_on:
      - portainer

volumes:
  portainer_data:

networks:
  portainer-net:
    driver: bridge
